[package]
name = "painpoints"
version = "0.2.0"
edition = "2021"
description = "Score every source file in a repository on six architectural pain dimensions"
license = "MIT"
repository = "https://github.com/prodBirdy/painpoints"
readme = "README.md"
keywords = ["architecture", "code-quality", "ai-agents", "mcp", "static-analysis"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1"
futures = "0.3"
gpui = "0.2.2"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
